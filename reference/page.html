<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice bridge</title>
<style>
    :root { color-scheme: light dark; font: 14px/1.4 -apple-system, system-ui, sans-serif; }
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #log { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { margin: 0 0 8px; white-space: pre-wrap; }
    .you { opacity: .7; }
    .error { color: #d33; }
    #status { padding: 4px 12px; font-size: 12px; opacity: .6; }
    textarea { margin: 0 12px 12px; padding: 8px; height: 4em; font: inherit; resize: none; }
</style>
</head>
<body>
<div id="log"></div>
<div id="status">connecting…</div>
<textarea id="box" placeholder="Dictate here: a paste sends at once, Enter sends typed text" autofocus></textarea>
<script>
    const log = document.getElementById('log')
    const box = document.getElementById('box')
    const status = document.getElementById('status')

    function show(label, text) {
        const p = document.createElement('p')
        p.className = `msg ${label}`
        p.textContent = `${label}: ${text}`
        log.append(p)
        log.scrollTop = log.scrollHeight
    }

    async function send(text) {
        text = text.trim()
        if (!text) return
        show('you', text)
        const res = await fetch('/send', { method: 'POST', body: text }).catch(() => null)
        if (!res?.ok) show('error', 'not delivered, is the claude session still running?')
    }

    // Send from the paste event itself: Chrome's own insertion drops Wispr Flow's later dictations.
    box.addEventListener('paste', e => {
        e.preventDefault()
        send(e.clipboardData.getData('text/plain'))
    })
    box.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault()
            send(box.value)
            box.value = ''
        }
    })

    const events = new EventSource('/events')
    events.onopen = () => { status.textContent = 'connected' }
    events.onerror = () => { status.textContent = 'disconnected, retrying' }
    events.onmessage = e => show('claude', JSON.parse(e.data).text)
</script>
</body>
</html>
