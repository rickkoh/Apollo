[workspace]
resolver = "3"
members = ["crates/hub", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.4.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-compat"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
